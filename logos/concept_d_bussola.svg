<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradD" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003F87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B0082;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Cerchio esterno bussola -->
  <circle cx="100" cy="95" r="55" fill="none" stroke="url(#gradD)" stroke-width="3"/>
  <circle cx="100" cy="95" r="48" fill="rgba(0,63,135,0.08)" stroke="url(#gradD)" stroke-width="1" opacity="0.5"/>
  <!-- Circuito interno (microchip) -->
  <rect x="72" y="72" width="56" height="46" rx="6" fill="#0A1628" stroke="#4B0082" stroke-width="1.5" opacity="0.6"/>
  <line x1="72" y1="83" x2="128" y2="83" stroke="#4B0082" stroke-width="0.8" opacity="0.4"/>
  <line x1="72" y1="95" x2="128" y2="95" stroke="#4B0082" stroke-width="0.8" opacity="0.6"/>
  <line x1="72" y1="107" x2="128" y2="107" stroke="#4B0082" stroke-width="0.8" opacity="0.4"/>
  <circle cx="100" cy="95" r="8" fill="#FFD700" opacity="0.3"/>
  <!-- Ago bussola (3 punte) -->
  <polygon points="100,45 105,65 95,65" fill="url(#gradD)" opacity="0.9"/>   <!-- NORD -->
  <polygon points="100,145 105,125 95,125" fill="#4B0082" opacity="0.4"/>   <!-- no sud -->
  <!-- Punti cardinali semplificati -->
  <text x="100" y="30" text-anchor="middle" font-size="10" fill="#FFD700" font-family="Arial" font-weight="bold">N</text>
  <circle cx="63" cy="95" r="3" fill="#4B0082" opacity="0.4"/>
  <circle cx="137" cy="95" r="3" fill="#4B0082" opacity="0.4"/>
  <!-- Etichette percorso sui 3 punti -->
  <polygon points="63,92 72,85 72,99" fill="#FF8C00" opacity="0.6"/>
  <polygon points="100,45 90,52 90,38" fill="#FFD700" opacity="0.8"/>
  <polygon points="100,95 92,88 108,88" fill="#003F87" opacity="0.5"/>
</svg>

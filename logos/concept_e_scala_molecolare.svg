<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradE1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradE2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradE3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B1FA2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E040FB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Esagono 1 - Teoria (libro) -->
  <polygon points="35,150 55,138 75,150 75,170 55,182 35,170" fill="url(#gradE1)" opacity="0.7" stroke="url(#gradE1)" stroke-width="1.5"/>
  <rect x="48" y="146" width="14" height="20" rx="2" fill="#FFF" opacity="0.3"/>
  <line x1="55" y1="148" x2="55" y2="164" stroke="#0A1628" stroke-width="0.8" opacity="0.6"/>
  <!-- Riga connessione 1→2 -->
  <line x1="75" y1="160" x2="95" y2="160" stroke="url(#gradE2)" stroke-width="2.5" stroke-dasharray="4,2"/>
  <!-- Esagono 2 - Pratica (ingranaggio) -->
  <polygon points="95,110 115,98 135,110 135,130 115,142 95,130" fill="url(#gradE2)" opacity="0.85" stroke="url(#gradE2)" stroke-width="1.5"/>
  <circle cx="115" cy="120" r="8" fill="none" stroke="#FFF" stroke-width="2" opacity="0.4"/>
  <circle cx="115" cy="120" r="3" fill="#FFF" opacity="0.5"/>
  <!-- Riga connessione 2→3 -->
  <line x1="135" y1="120" x2="155" y2="120" stroke="url(#gradE3)" stroke-width="2.5" stroke-dasharray="4,2"/>
  <!-- Esagono 3 - Maestria (stella) -->
  <polygon points="155,70 175,58 195,70 195,90 175,102 155,90" fill="url(#gradE3)" opacity="1" stroke="url(#gradE3)" stroke-width="1.5"/>
  <polygon points="175,62 178,74 190,74 180,81 184,93 175,86 166,93 170,81 160,74 172,74" fill="#FFD700" opacity="0.9"/>
  <!-- Etichette -->
  <text x="55" y="195" text-anchor="middle" font-size="9" fill="#64B5F6" font-family="Arial">Teoria</text>
  <text x="115" y="165" text-anchor="middle" font-size="9" fill="#64B5F6" font-family="Arial">Pratica</text>
  <text x="175" y="125" text-anchor="middle" font-size="9" fill="#64B5F6" font-family="Arial">Maestria</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <defs>
    <linearGradient id="gradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4B0082;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- M - libro aperto -->
  <g transform="translate(10,10)">
    <path d="M 5 65 L 25 20 L 45 65 L 25 45 Z" fill="url(#gradF)" opacity="0.9"/>
    <path d="M 5 65 L 25 20 L 45 65 L 25 45 Z" fill="none" stroke="url(#gradF)" stroke-width="1"/>
  </g>
  
  <!-- L - freccia in su -->
  <g transform="translate(65,10)">
    <rect x="0" y="45" width="12" height="20" rx="2" fill="url(#gradF)" opacity="0.85"/>
    <polygon points="6,0 18,25 0,25" fill="url(#gradF)" opacity="0.95"/>
  </g>
  
  <!-- P - percorso curvilineo -->
  <g transform="translate(110,10)">
    <path d="M 0 65 Q 20 65 30 45 Q 35 35 30 20 Q 25 10 15 10 L 42 10" 
          stroke="url(#gradF)" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
    <circle cx="15" cy="10" r="4" fill="url(#gradF)" opacity="0.8"/>
    <circle cx="30" cy="40" r="3" fill="url(#gradF)" opacity="0.6"/>
    <circle cx="10" cy="60" r="3" fill="url(#gradF)" opacity="0.5"/>
  </g>
  
  <!-- G - cerchio completamento con spunta -->
  <g transform="translate(175,10)">
    <circle cx="30" cy="35" r="30" fill="none" stroke="url(#gradF)" stroke-width="7" opacity="0.8"/>
    <path d="M 18 35 L 26 44 L 42 24" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>
  
  <!-- Label -->
  <text x="140" y="95" text-anchor="middle" font-size="10" fill="#64B5F6" font-family="Arial" letter-spacing="4">MICRO LEARNING</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <defs>
    <linearGradient id="gM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <linearGradient id="gL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976D2"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <linearGradient id="gP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B0082"/>
      <stop offset="100%" style="stop-color:#7B1FA2"/>
    </linearGradient>
    <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B1FA2"/>
      <stop offset="100%" style="stop-color:#E040FB"/>
    </linearGradient>
  </defs>

  <!-- Sfondo opzionale -->
  <rect x="0" y="0" width="320" height="100" rx="12" fill="#0A1628" opacity="0"/>

  <!-- === M === -->
  <g transform="translate(5,8)">
    <rect x="0" y="20" width="8" height="55" rx="3" fill="url(#gM)"/>
    <rect x="32" y="20" width="8" height="55" rx="3" fill="url(#gM)"/>
    <path d="M 8 20 L 20 50 L 32 20" fill="none" stroke="url(#gM)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === L === -->
  <g transform="translate(55,8)">
    <rect x="0" y="0" width="10" height="70" rx="3" fill="url(#gL)"/>
    <polygon points="-4,0 5,-14 14,0" fill="url(#gL)" opacity="0.9"/>
    <!-- linea orizzontale base -->
    <rect x="0" y="60" width="32" height="10" rx="3" fill="url(#gL)"/>
  </g>

  <!-- === P === -->
  <g transform="translate(105,8)">
    <rect x="0" y="0" width="10" height="75" rx="3" fill="url(#gP)"/>
    <path d="M 10 0 L 38 0 Q 50 0 50 15 Q 50 30 38 30 L 20 30 L 20 50" 
          fill="none" stroke="url(#gP)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- pallino percorso -->
    <circle cx="38" cy="0" r="2" fill="url(#gP)" opacity="0.6"/>
    <circle cx="50" cy="15" r="2.5" fill="url(#gP)" opacity="0.8"/>
    <circle cx="38" cy="30" r="2" fill="url(#gP)" opacity="0.6"/>
  </g>

  <!-- === G === -->
  <g transform="translate(175,8)">
    <!-- Cerchio principale -->
    <circle cx="35" cy="35" r="32" fill="none" stroke="url(#gG)" stroke-width="10"/>
    <!-- Taglio interno (per distinguere G da O) -->
    <rect x="35" y="20" width="32" height="30" rx="5" fill="#0A1628"/>
    <!-- Segmento orizzontale della G -->
    <path d="M 22 35 L 50 35" stroke="url(#gG)" stroke-width="10" stroke-linecap="round"/>
    <!-- Spunta completamento -->
    <path d="M 20 35 L 28 44 L 42 24" stroke="#FFD700" stroke-width="3.5" fill="none" 
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Testo MLPG sotto -->
  <text x="160" y="95" text-anchor="middle" font-size="12" fill="#64B5F6" 
        font-family="Arial, sans-serif" font-weight="bold" letter-spacing="6">M L P G</text>
</svg>

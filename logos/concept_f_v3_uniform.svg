<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003F87"/>
      <stop offset="33%" style="stop-color:#4B0082"/>
      <stop offset="66%" style="stop-color:#7B1FA2"/>
      <stop offset="100%" style="stop-color:#E040FB"/>
    </linearGradient>
  </defs>

  <!-- Griglia uniforme: ogni lettera occupa 60px di larghezza, 65px di altezza, baseline a y=75 -->
  
  <!-- === M === (rect 60x65) -->
  <g transform="translate(8,10)">
    <rect x="0" y="10" width="8" height="55" rx="3" fill="url(#g)"/>
    <rect x="52" y="10" width="8" height="55" rx="3" fill="url(#g)"/>
    <path d="M 8 10 L 30 50 L 52 10" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === L === (rect 60x65) -->
  <g transform="translate(78,10)">
    <rect x="0" y="0" width="8" height="65" rx="3" fill="url(#g)"/>
    <rect x="0" y="55" width="45" height="10" rx="3" fill="url(#g)"/>
    <polygon points="-3,0 4,-14 11,0" fill="url(#g)"/>
  </g>

  <!-- === P === (rect 60x65) -->
  <g transform="translate(148,10)">
    <rect x="0" y="0" width="8" height="65" rx="3" fill="url(#g)"/>
    <path d="M 8 0 L 45 0 Q 55 0 55 14 Q 55 28 45 28 L 20 28" 
          fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- === G === (rect 60x65) -->
  <g transform="translate(218,10)">
    <circle cx="30" cy="32" r="30" fill="none" stroke="url(#g)" stroke-width="8"/>
    <rect x="30" y="22" width="30" height="20" rx="3" fill="#0A1628"/>
    <line x1="22" y1="32" x2="48" y2="32" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Etichette -->
  <text x="38" y="95" text-anchor="middle" font-size="11" fill="#64B5F6" font-family="Arial" font-weight="bold">M</text>
  <text x="108" y="95" text-anchor="middle" font-size="11" fill="#64B5F6" font-family="Arial" font-weight="bold">L</text>
  <text x="178" y="95" text-anchor="middle" font-size="11" fill="#64B5F6" font-family="Arial" font-weight="bold">P</text>
  <text x="248" y="95" text-anchor="middle" font-size="11" fill="#64B5F6" font-family="Arial" font-weight="bold">G</text>
</svg>

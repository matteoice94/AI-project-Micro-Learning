<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <style>
      .b1 { fill: #003F87 } .b2 { fill: #1565C0 } .b3 { fill: #1E88E5 } .b4 { fill: #64B5F6 }
      .d  { fill: #0A1628 } .w  { fill: #E0E0E0 } .g  { fill: #FFD700 } .p  { fill: #4B0082 }
    </style>
  </defs>

  <!-- Antenna -->
  <rect x="60" y="0" width="8" height="8" class="p"/>
  <rect x="56" y="4" width="16" height="8" class="p"/>
  <rect x="60" y="8" width="8" height="8" class="b4"/>
  <rect x="56" y="12" width="16" height="8" class="b2"/>
  <rect x="52" y="16" width="24" height="4" class="g">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="52" y="4" width="4" height="8" class="g">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Testa -->
  <rect x="32" y="20" width="64" height="4" class="b2"/>
  <rect x="32" y="24" width="4" height="60" class="b2"/>
  <rect x="92" y="24" width="4" height="60" class="b2"/>
  <rect x="36" y="80" width="60" height="4" class="b2"/>
  <rect x="36" y="24" width="56" height="56" class="b1"/>
  <!-- Angoli -->
  <rect x="32" y="20" width="8" height="4" class="b3"/>
  <rect x="28" y="24" width="4" height="8" class="b3"/>
  <rect x="88" y="20" width="8" height="4" class="b3"/>
  <rect x="96" y="24" width="4" height="8" class="b3"/>
  <rect x="28" y="76" width="4" height="8" class="b3"/>
  <rect x="32" y="80" width="8" height="4" class="b3"/>
  <rect x="96" y="76" width="4" height="8" class="b3"/>
  <rect x="88" y="80" width="8" height="4" class="b3"/>

  <!-- Schermo -->
  <rect x="44" y="32" width="40" height="36" class="d"/>

  <!-- Occhi animati -->
  <g>
    <!-- Sinistro -->
    <rect x="52" y="40" width="8" height="8" class="w"/>
    <rect x="52" y="48" width="4" height="4" class="w"/>
    <rect x="56" y="44" width="4" height="4" class="b4"/>
    <!-- Destro (ammicca) -->
    <rect x="68" y="40" width="8" height="4" class="w">
      <animate attributeName="height" values="8;1;8" dur="3s" repeatCount="indefinite" keyTimes="0;0.08;0.16"/>
    </rect>
    <rect x="68" y="48" width="4" height="4" class="w">
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.08;0.16"/>
    </rect>
    <rect x="72" y="44" width="4" height="4" class="b4">
      <animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite" keyTimes="0;0.08;0.16"/>
    </rect>
  </g>

  <!-- Bocca animata -->
  <rect x="56" y="56" width="4" height="4" class="b4">
    <animate attributeName="y" values="56;56;56" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="60" width="8" height="4" class="b4"/>
  <rect x="68" y="56" width="4" height="4" class="b4"/>

  <!-- Orecchie -->
  <rect x="24" y="40" width="8" height="16" class="b1"/>
  <rect x="24" y="40" width="4" height="4" class="b3"/>
  <rect x="24" y="52" width="4" height="4" class="p"/>
  <rect x="96" y="40" width="8" height="16" class="b1"/>
  <rect x="100" y="40" width="4" height="4" class="b3"/>
  <rect x="100" y="52" width="4" height="4" class="p"/>

  <!-- Braccia -->
  <rect x="12" y="48" width="12" height="8" class="b1"/>
  <rect x="12" y="44" width="4" height="4" class="b3"/>
  <rect x="20" y="56" width="4" height="4" class="b2"/>
  <rect x="104" y="48" width="12" height="8" class="b1"/>
  <rect x="112" y="44" width="4" height="4" class="b3"/>
  <rect x="104" y="56" width="4" height="4" class="b2"/>

  <!-- Corpo -->
  <rect x="40" y="84" width="48" height="32" class="b1"/>
  <rect x="40" y="84" width="4" height="4" class="b3"/>
  <rect x="84" y="84" width="4" height="4" class="b3"/>
  <rect x="40" y="112" width="4" height="4" class="p"/>
  <rect x="84" y="112" width="4" height="4" class="p"/>

  <!-- Pulsanti -->
  <rect x="52" y="92" width="8" height="8" class="g"/>
  <rect x="52" y="92" width="4" height="4" fill="#FFF8E1"/>
  <rect x="68" y="92" width="8" height="8" class="p"/>
  <rect x="68" y="92" width="4" height="4" fill="#7E57C2"/>

  <!-- Gambe -->
  <rect x="44" y="116" width="12" height="12" class="b1"/>
  <rect x="44" y="116" width="4" height="4" class="b3"/>
  <rect x="72" y="116" width="12" height="12" class="b1"/>
  <rect x="76" y="116" width="4" height="4" class="b3"/>
</svg>

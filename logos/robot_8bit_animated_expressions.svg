<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 348" width="432" height="348" shape-rendering="crispEdges">
  <defs>
    <style>
      .g  { fill: #FFD700 }
      .b3 { fill: #64B5F6 }
      .b2 { fill: #1565C0 }
      .b1 { fill: #003F87 }
      .p  { fill: #4B0082 }
      .d  { fill: #0A1628 }
      .db { fill: #0D1F3C }

      /* Animation keyframes */
      @keyframes blink {
        0%, 90%, 100% { opacity: 1; }
        95% { opacity: 0; }
      }
      @keyframes cycleExpression {
        0%, 20%   { opacity: 1; }   /* neutral */
        25%, 45%  { opacity: 0; }
        25.1%, 44.9% { opacity: 0; }  /* happy */
        50%, 70%  { opacity: 0; }
        50.1%, 69.9% { opacity: 0; }  /* thinking */
        75%, 100% { opacity: 0; }     /* neutral again */
      }
    </style>
  </defs>

  <!-- ===== ANTENNA (static) ===== -->
  <rect x="192" y="0"  width="24" height="24" fill="#FFD700"/>
  <rect x="216" y="0"  width="24" height="24" fill="#FFD700"/>
  <rect x="192" y="24" width="24" height="24" fill="#FFD700"/>
  <rect x="216" y="24" width="24" height="24" fill="#FFD700"/>

  <!-- ===== HEAD OUTLINE (static, same as reference) ===== -->
  <!-- Row 48 -->
  <rect x="120" y="48" width="24" height="24" fill="#64B5F6"/><rect x="144" y="48" width="24" height="24" fill="#1565C0"/>
  <rect x="168" y="48" width="24" height="24" fill="#1565C0"/><rect x="192" y="48" width="24" height="24" fill="#1565C0"/>
  <rect x="216" y="48" width="24" height="24" fill="#1565C0"/><rect x="240" y="48" width="24" height="24" fill="#1565C0"/>
  <rect x="264" y="48" width="24" height="24" fill="#1565C0"/><rect x="288" y="48" width="24" height="24" fill="#64B5F6"/>
  <!-- Row 72 -->
  <rect x="96"  y="72" width="24" height="24" fill="#64B5F6"/><rect x="120" y="72" width="24" height="24" fill="#1565C0"/>
  <rect x="144" y="72" width="24" height="24" fill="#1565C0"/><rect x="168" y="72" width="24" height="24" fill="#1565C0"/>
  <rect x="192" y="72" width="24" height="24" fill="#1565C0"/><rect x="216" y="72" width="24" height="24" fill="#1565C0"/>
  <rect x="240" y="72" width="24" height="24" fill="#1565C0"/><rect x="264" y="72" width="24" height="24" fill="#1565C0"/>
  <rect x="288" y="72" width="24" height="24" fill="#1565C0"/><rect x="312" y="72" width="24" height="24" fill="#64B5F6"/>
  <!-- Row 96 -->
  <rect x="72"  y="96" width="24" height="24" fill="#1565C0"/>
  <rect x="96"  y="96" width="24" height="24" fill="#003F87"/><rect x="120" y="96" width="24" height="24" fill="#003F87"/>
  <rect x="144" y="96" width="24" height="24" fill="#003F87"/><rect x="168" y="96" width="24" height="24" fill="#003F87"/>
  <rect x="192" y="96" width="24" height="24" fill="#003F87"/><rect x="216" y="96" width="24" height="24" fill="#003F87"/>
  <rect x="240" y="96" width="24" height="24" fill="#003F87"/><rect x="264" y="96" width="24" height="24" fill="#003F87"/>
  <rect x="288" y="96" width="24" height="24" fill="#003F87"/><rect x="312" y="96" width="24" height="24" fill="#003F87"/>
  <rect x="336" y="96" width="24" height="24" fill="#1565C0"/>

  <!-- Side ears (static) -->
  <rect x="48" y="144" width="24" height="24" fill="#64B5F6"/><rect x="360" y="144" width="24" height="24" fill="#64B5F6"/>
  <rect x="48" y="168" width="24" height="24" fill="#64B5F6"/><rect x="360" y="168" width="24" height="24" fill="#64B5F6"/>
  <rect x="48" y="192" width="24" height="24" fill="#64B5F6"/><rect x="360" y="192" width="24" height="24" fill="#64B5F6"/>
  <rect x="48" y="216" width="24" height="24" fill="#64B5F6"/><rect x="360" y="216" width="24" height="24" fill="#64B5F6"/>

  <!-- ===== SCREEN BORDER (static) ===== -->
  <!-- Row 120 borders -->
  <rect x="72" y="120" width="24" height="24" fill="#1565C0"/><rect x="336" y="120" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="120" width="24" height="24" fill="#003F87"/><rect x="312" y="120" width="24" height="24" fill="#003F87"/>
  <!-- Row 144 borders -->
  <rect x="72" y="144" width="24" height="24" fill="#1565C0"/><rect x="336" y="144" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="144" width="24" height="24" fill="#003F87"/><rect x="312" y="144" width="24" height="24" fill="#003F87"/>
  <!-- Row 168 borders -->
  <rect x="72" y="168" width="24" height="24" fill="#1565C0"/><rect x="336" y="168" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="168" width="24" height="24" fill="#003F87"/><rect x="312" y="168" width="24" height="24" fill="#003F87"/>
  <!-- Row 192 borders -->
  <rect x="72" y="192" width="24" height="24" fill="#1565C0"/><rect x="336" y="192" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="192" width="24" height="24" fill="#003F87"/><rect x="312" y="192" width="24" height="24" fill="#003F87"/>
  <!-- Row 216 borders -->
  <rect x="72" y="216" width="24" height="24" fill="#1565C0"/><rect x="336" y="216" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="216" width="24" height="24" fill="#003F87"/><rect x="312" y="216" width="24" height="24" fill="#003F87"/>
  <!-- Row 240 borders -->
  <rect x="72" y="240" width="24" height="24" fill="#1565C0"/><rect x="336" y="240" width="24" height="24" fill="#1565C0"/>
  <rect x="96" y="240" width="24" height="24" fill="#003F87"/><rect x="312" y="240" width="24" height="24" fill="#003F87"/>

  <!-- ===== SCREEN BACKGROUND (always dark) ===== -->
  <g id="screen-bg">
    <rect x="120" y="120" width="24" height="24" fill="#0A1628"/><rect x="144" y="120" width="24" height="24" fill="#0A1628"/>
    <rect x="168" y="120" width="24" height="24" fill="#0A1628"/><rect x="192" y="120" width="24" height="24" fill="#0A1628"/>
    <rect x="216" y="120" width="24" height="24" fill="#0A1628"/><rect x="240" y="120" width="24" height="24" fill="#0A1628"/>
    <rect x="264" y="120" width="24" height="24" fill="#0A1628"/><rect x="288" y="120" width="24" height="24" fill="#0A1628"/>
  </g>

  <!-- ===== EXPRESSION 1: NEUTRAL (default, always visible as base) ===== -->
  <g id="expr-neutral">
    <!-- Row 144 screen pixels between eyes -->
    <rect x="120" y="144" width="24" height="24" fill="#0A1628"/>
    <rect x="192" y="144" width="24" height="24" fill="#0A1628"/><rect x="216" y="144" width="24" height="24" fill="#0A1628"/>
    <rect x="240" y="144" width="24" height="24" fill="#0A1628"/><rect x="288" y="144" width="24" height="24" fill="#0A1628"/>
    <!-- Row 168 -->
    <rect x="120" y="168" width="24" height="24" fill="#0A1628"/>
    <rect x="192" y="168" width="24" height="24" fill="#0A1628"/><rect x="216" y="168" width="24" height="24" fill="#0A1628"/>
    <rect x="240" y="168" width="24" height="24" fill="#0A1628"/><rect x="288" y="168" width="24" height="24" fill="#0A1628"/>
    <!-- Row 192 -->
    <rect x="120" y="192" width="24" height="24" fill="#0A1628"/><rect x="144" y="192" width="24" height="24" fill="#0A1628"/>
    <rect x="168" y="192" width="24" height="24" fill="#0A1628"/><rect x="192" y="192" width="24" height="24" fill="#0A1628"/>
    <rect x="216" y="192" width="24" height="24" fill="#0A1628"/><rect x="240" y="192" width="24" height="24" fill="#0A1628"/>
    <rect x="264" y="192" width="24" height="24" fill="#0A1628"/><rect x="288" y="192" width="24" height="24" fill="#0A1628"/>
    <!-- Row 216 (except mouth) -->
    <rect x="120" y="216" width="24" height="24" fill="#0A1628"/><rect x="144" y="216" width="24" height="24" fill="#0A1628"/>
    <rect x="168" y="216" width="24" height="24" fill="#0A1628"/>
    <rect x="240" y="216" width="24" height="24" fill="#0A1628"/><rect x="264" y="216" width="24" height="24" fill="#0A1628"/>
    <rect x="288" y="216" width="24" height="24" fill="#0A1628"/>
    <!-- Row 240 -->
    <rect x="120" y="240" width="24" height="24" fill="#0A1628"/><rect x="144" y="240" width="24" height="24" fill="#0A1628"/>
    <rect x="168" y="240" width="24" height="24" fill="#0A1628"/><rect x="192" y="240" width="24" height="24" fill="#0A1628"/>
    <rect x="216" y="240" width="24" height="24" fill="#0A1628"/><rect x="240" y="240" width="24" height="24" fill="#0A1628"/>
    <rect x="264" y="240" width="24" height="24" fill="#0A1628"/><rect x="288" y="240" width="24" height="24" fill="#0A1628"/>
  </g>

  <!-- Eyes NEUTRAL (2x2 indigo blocks) -->
  <g id="eyes-neutral">
    <rect x="144" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="168" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="144" y="168" width="24" height="24" fill="#4B0082"/>
    <rect x="168" y="168" width="24" height="24" fill="#4B0082"/>
    <!-- Right eye -->
    <rect x="240" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="264" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="240" y="168" width="24" height="24" fill="#4B0082"/>
    <rect x="264" y="168" width="24" height="24" fill="#4B0082"/>
  </g>

  <!-- Mouth NEUTRAL -->
  <g id="mouth-neutral">
    <rect x="192" y="216" width="24" height="24" fill="#4B0082"/>
    <rect x="216" y="216" width="24" height="24" fill="#4B0082"/>
  </g>

  <!-- ===== EXPRESSION 2: HAPPY (eyes ^ ^ and wider smile) ===== -->
  <g id="eyes-happy" style="opacity: 0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.45;0.46;1"/>
    <!-- Left eye ^ shape: row 144 col 144+168 only (top of eye arch), row 168 col 120+192 (wider) -->
    <rect x="144" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="168" y="144" width="24" height="24" fill="#4B0082"/>
    <!-- Right eye ^ shape -->
    <rect x="240" y="144" width="24" height="24" fill="#4B0082"/>
    <rect x="264" y="144" width="24" height="24" fill="#4B0082"/>
  </g>
  <!-- Wide smile pixels for happy -->
  <g id="mouth-happy" style="opacity: 0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.24;0.25;0.45;0.46;1"/>
    <!-- Wider smile: 4 pixels across, row 216 -->
    <rect x="168" y="216" width="24" height="24" fill="#4B0082"/>
    <rect x="192" y="216" width="24" height="24" fill="#4B0082"/>
    <rect x="216" y="216" width="24" height="24" fill="#4B0082"/>
    <rect x="240" y="216" width="24" height="24" fill="#4B0082"/>
    <!-- Extra row for bigger smile -->
    <rect x="168" y="240" width="24" height="24" fill="#0A1628"/>
    <rect x="240" y="240" width="24" height="24" fill="#0A1628"/>
    <!-- Bottom of smile (row 240) -->
    <rect x="192" y="240" width="24" height="24" fill="#0A1628"/>
    <rect x="216" y="240" width="24" height="24" fill="#0A1628"/>
  </g>

  <!-- ===== EXPRESSION 3: THINKING (squint eyes, mouth to left, shrunk) ===== -->
  <g id="eyes-thinking" style="opacity: 0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.45;0.49;0.50;0.55;0.70;0.71;1"/>
    <!-- Squint: only 1 row of eyes, slightly narrower -->
    <rect x="144" y="168" width="24" height="24" fill="#4B0082"/>
    <rect x="168" y="168" width="24" height="24" fill="#4B0082"/>
    <!-- Right eye also squinted -->
    <rect x="240" y="168" width="24" height="24" fill="#4B0082"/>
    <rect x="264" y="168" width="24" height="24" fill="#4B0082"/>
  </g>
  <g id="mouth-thinking" style="opacity: 0">
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0" dur="10s" repeatCount="indefinite" keyTimes="0;0.45;0.49;0.50;0.55;0.70;0.71;1"/>
    <!-- Mouth moved to the left, smaller (just 1 pixel at column 168) -->
    <rect x="168" y="216" width="24" height="24" fill="#4B0082"/>
  </g>

  <!-- ===== CHIN / BOTTOM HEAD (static) ===== -->
  <!-- Row 264 -->
  <rect x="72"  y="264" width="24" height="24" fill="#1565C0"/>
  <rect x="96"  y="264" width="24" height="24" fill="#003F87"/><rect x="120" y="264" width="24" height="24" fill="#003F87"/>
  <rect x="144" y="264" width="24" height="24" fill="#003F87"/><rect x="168" y="264" width="24" height="24" fill="#003F87"/>
  <rect x="192" y="264" width="24" height="24" fill="#003F87"/><rect x="216" y="264" width="24" height="24" fill="#003F87"/>
  <rect x="240" y="264" width="24" height="24" fill="#003F87"/><rect x="264" y="264" width="24" height="24" fill="#003F87"/>
  <rect x="288" y="264" width="24" height="24" fill="#003F87"/><rect x="312" y="264" width="24" height="24" fill="#003F87"/>
  <rect x="336" y="264" width="24" height="24" fill="#1565C0"/>
  <!-- Row 288 -->
  <rect x="96"  y="288" width="24" height="24" fill="#64B5F6"/><rect x="120" y="288" width="24" height="24" fill="#1565C0"/>
  <rect x="144" y="288" width="24" height="24" fill="#1565C0"/><rect x="168" y="288" width="24" height="24" fill="#1565C0"/>
  <rect x="192" y="288" width="24" height="24" fill="#1565C0"/><rect x="216" y="288" width="24" height="24" fill="#1565C0"/>
  <rect x="240" y="288" width="24" height="24" fill="#1565C0"/><rect x="264" y="288" width="24" height="24" fill="#1565C0"/>
  <rect x="288" y="288" width="24" height="24" fill="#1565C0"/><rect x="312" y="288" width="24" height="24" fill="#64B5F6"/>
  <!-- Row 312 (base) -->
  <rect x="120" y="312" width="24" height="24" fill="#64B5F6"/><rect x="144" y="312" width="24" height="24" fill="#1565C0"/>
  <rect x="168" y="312" width="24" height="24" fill="#1565C0"/><rect x="192" y="312" width="24" height="24" fill="#1565C0"/>
  <rect x="216" y="312" width="24" height="24" fill="#1565C0"/><rect x="240" y="312" width="24" height="24" fill="#1565C0"/>
  <rect x="264" y="312" width="24" height="24" fill="#1565C0"/><rect x="288" y="312" width="24" height="24" fill="#64B5F6"/>

  <!-- Label -->
  <text x="216" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#64B5F6" letter-spacing="6">MLPG</text>
</svg>

<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MLPG 8-bit Robot Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A1628; color: #fff; font-family: 'Courier New', monospace; padding: 40px; text-align: center; }
    h1 { margin-bottom: 4px; font-size: 1.5rem; }
    .sub { color: rgba(255,255,255,0.4); margin-bottom: 30px; font-size: 0.85rem; }
    .showcase { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 30px; }
    .card { background: #111; border: 2px solid #003F87; border-radius: 0; padding: 16px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .card img { width: 160px; height: 160px; image-rendering: pixelated; }
    .card p { margin-top: 8px; font-size: 0.8rem; color: rgba(255,255,255,0.5); }
    .highlight { max-width: 260px; margin: 0 auto 30px; }
    .highlight img { width: 200px; height: 200px; image-rendering: pixelated; }
    .label { display: inline-block; margin-top: 6px; padding: 2px 8px; font-size: 0.65rem; background: #003F87; color: #64B5F6; text-transform: uppercase; letter-spacing: 2px; }
  </style>
</head>
<body>
  <h1>MLPG 8-BIT ROBOT</h1>
  <p class="sub">Pixel art retro — stile NES / Game Boy</p>

  <div class="highlight">
    <img src="robot_8bit_animated.svg" alt="8-bit Robot Animated">
    <p>Versione animata — ammicca e sorride</p>
    <span class="label">ANIMATED</span>
  </div>

  <div class="showcase">
    <div class="card">
      <img src="robot_8bit.svg" alt="8-bit Default">
      <p>Default</p>
      <span class="label">IDLE</span>
    </div>
    <div class="card">
      <img src="robot_8bit_happy.svg" alt="8-bit Happy">
      <p>Felice</p>
      <span class="label">HAPPY</span>
    </div>
    <div class="card">
      <img src="robot_8bit_thinking.svg" alt="8-bit Thinking">
      <p>Pensieroso</p>
      <span class="label">THINK</span>
    </div>
    <div class="card">
      <img src="robot_8bit_idea.svg" alt="8-bit Idea">
      <p>Idea!</p>
      <span class="label">IDEA</span>
    </div>
  </div>
</body>
</html>

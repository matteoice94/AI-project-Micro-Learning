<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="100%" style="stop-color:#1A237E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Antenna -->
  <line x1="100" y1="18" x2="100" y2="38" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="14" r="6" fill="#FFD700" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Corpo -->
  <rect x="55" y="38" width="90" height="90" rx="16" fill="url(#bodyGrad)" stroke="#64B5F6" stroke-width="2"/>

  <!-- Viso (schermo) -->
  <rect x="65" y="48" width="70" height="55" rx="10" fill="url(#faceGrad)" stroke="#42A5F5" stroke-width="1.5"/>

  <!-- Occhi -->
  <ellipse cx="86" cy="70" rx="8" ry="9" fill="#0A1628"/>
  
  <!-- Occhio destro: ammicca -->
  <g>
    <ellipse cx="114" cy="70" rx="8" ry="9" fill="#0A1628">
      <animate attributeName="ry" values="9;1;9" dur="4s" repeatCount="indefinite" keyTimes="0;0.1;0.2"/>
    </ellipse>
  </g>

  <!-- Pupille -->
  <circle cx="88" cy="68" r="3" fill="#64B5F6"/>
  <circle cx="116" cy="68" r="3" fill="#64B5F6">
    <animate attributeName="cy" values="68;68;68" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Sopracciglia -->
  <rect x="78" y="56" width="16" height="3" rx="1.5" fill="#42A5F5" opacity="0.7">
    <animate attributeName="y" values="56;54;56" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="106" y="56" width="16" height="3" rx="1.5" fill="#42A5F5" opacity="0.7">
    <animate attributeName="y" values="56;58;56" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Bocca (sorriso) -->
  <path d="M 88 88 Q 100 100 112 88" fill="none" stroke="#64B5F6" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M 88 88 Q 100 100 112 88;M 90 92 Q 100 88 110 92;M 88 88 Q 100 100 112 88" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Orecchie -->
  <rect x="43" y="60" width="16" height="22" rx="5" fill="url(#bodyGrad)" stroke="#64B5F6" stroke-width="1.5"/>
  <rect x="141" y="60" width="16" height="22" rx="5" fill="url(#bodyGrad)" stroke="#64B5F6" stroke-width="1.5"/>
  <!-- Dettaglio orecchie -->
  <rect x="47" y="65" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>
  <rect x="145" y="65" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>

  <!-- Braccia -->
  <rect x="28" y="50" width="18" height="8" rx="4" fill="url(#bodyGrad)"/>
  <circle cx="46" cy="54" r="5" fill="#4B0082"/>
  <rect x="154" y="50" width="18" height="8" rx="4" fill="url(#bodyGrad)"/>
  <circle cx="154" cy="54" r="5" fill="#4B0082"/>

  <!-- Corpo sotto la testa -->
  <rect x="70" y="130" width="60" height="35" rx="8" fill="url(#bodyGrad)" stroke="#64B5F6" stroke-width="1.5"/>
  
  <!-- Pulsanti corpo -->
  <circle cx="85" cy="147" r="5" fill="#FFD700" opacity="0.6" filter="url(#glow)"/>
  <circle cx="100" cy="147" r="5" fill="#FF8C00" opacity="0.5"/>
  <circle cx="115" cy="147" r="5" fill="#64B5F6" opacity="0.7"/>

  <!-- Gambette -->
  <rect x="77" y="167" width="16" height="14" rx="4" fill="url(#bodyGrad)"/>
  <rect x="107" y="167" width="16" height="14" rx="4" fill="url(#bodyGrad)"/>

  <!-- Scintille AI intorno -->
  <text x="42" y="42" font-size="8" opacity="0.6">✦</text>
  <text x="150" y="40" font-size="7" opacity="0.5">⚡</text>
  <text x="36" y="110" font-size="6" opacity="0.4">✦</text>
  <text x="155" y="105" font-size="7" opacity="0.5">✦</text>
</svg>

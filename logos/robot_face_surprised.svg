<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <linearGradient id="fc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="100%" style="stop-color:#1A237E"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Antenna (più lunga = sorpresa) -->
  <line x1="100" y1="16" x2="100" y2="40" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="11" r="7" fill="#FFD700" filter="url(#gl)" opacity="1"/>
  <!-- Scintilla sopra antenna -->
  <text x="95" y="4" font-size="14" fill="#FFD700" opacity="0.8">✦</text>

  <!-- Corpo -->
  <rect x="55" y="40" width="90" height="90" rx="16" fill="url(#bd)" stroke="#64B5F6" stroke-width="2"/>

  <!-- Schermo viso -->
  <rect x="65" y="50" width="70" height="55" rx="10" fill="url(#fc)" stroke="#42A5F5" stroke-width="1.5"/>

  <!-- Occhi spalancati -->
  <ellipse cx="86" cy="72" rx="10" ry="11" fill="#0A1628"/>
  <ellipse cx="114" cy="72" rx="10" ry="11" fill="#0A1628"/>
  <circle cx="86" cy="70" r="4" fill="#64B5F6"/>
  <circle cx="114" cy="70" r="4" fill="#64B5F6"/>
  <!-- Riflesso -->
  <circle cx="83" cy="67" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="111" cy="67" r="1.5" fill="#fff" opacity="0.3"/>

  <!-- Sopracciglia alzate -->
  <rect x="76" y="52" width="20" height="3" rx="1.5" fill="#42A5F5" opacity="0.9"/>
  <rect x="104" y="52" width="20" height="3" rx="1.5" fill="#42A5F5" opacity="0.9"/>

  <!-- Bocca a "O" -->
  <ellipse cx="100" cy="92" rx="8" ry="10" fill="#0A1628" stroke="#64B5F6" stroke-width="2"/>

  <!-- Orecchie -->
  <rect x="43" y="62" width="16" height="22" rx="5" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  <rect x="141" y="62" width="16" height="22" rx="5" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  <rect x="47" y="67" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>
  <rect x="145" y="67" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>

  <!-- Braccia alzate (sorpresa) -->
  <rect x="28" y="44" width="8" height="24" rx="4" fill="url(#bd)" transform="rotate(-20, 32, 56)"/>
  <circle cx="22" cy="38" r="5" fill="#4B0082"/>
  <rect x="164" y="44" width="8" height="24" rx="4" fill="url(#bd)" transform="rotate(20, 168, 56)"/>
  <circle cx="178" cy="38" r="5" fill="#4B0082"/>

  <!-- Corpo inferiore -->
  <rect x="70" y="132" width="60" height="35" rx="8" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  <circle cx="85" cy="149" r="5" fill="#FFD700" opacity="0.8" filter="url(#gl)"/>
  <circle cx="100" cy="149" r="5" fill="#FF8C00" opacity="0.6"/>
  <circle cx="115" cy="149" r="5" fill="#64B5F6" opacity="0.7"/>

  <!-- Gambe -->
  <rect x="77" y="169" width="16" height="14" rx="4" fill="url(#bd)"/>
  <rect x="107" y="169" width="16" height="14" rx="4" fill="url(#bd)"/>

  <!-- Scintille intorno -->
  <text x="40" y="44" font-size="9" fill="#FFD700" opacity="0.6">✦</text>
  <text x="155" y="42" font-size="8" fill="#FFD700" opacity="0.5">⚡</text>
  <text x="38" y="112" font-size="7" fill="#FFD700" opacity="0.4">✦</text>
  <text x="152" y="108" font-size="6" fill="#FFD700" opacity="0.5">✦</text>
</svg>

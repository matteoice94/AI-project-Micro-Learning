<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003F87"/>
      <stop offset="100%" style="stop-color:#4B0082"/>
    </linearGradient>
    <linearGradient id="fc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1"/>
      <stop offset="100%" style="stop-color:#1A237E"/>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Antenna -->
  <line x1="100" y1="20" x2="100" y2="40" stroke="#64B5F6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="15" r="6" fill="#FFD700" filter="url(#gl)" opacity="0.9"/>

  <!-- Corpo -->
  <rect x="55" y="40" width="90" height="90" rx="16" fill="url(#bd)" stroke="#64B5F6" stroke-width="2"/>

  <!-- Schermo viso -->
  <rect x="65" y="50" width="70" height="55" rx="10" fill="url(#fc)" stroke="#42A5F5" stroke-width="1.5"/>

  <!-- Occhi pensierosi (guardano in alto a destra) -->
  <ellipse cx="86" cy="72" rx="8" ry="9" fill="#0A1628"/>
  <ellipse cx="114" cy="72" rx="8" ry="9" fill="#0A1628"/>
  <circle cx="90" cy="68" r="3.5" fill="#64B5F6"/>
  <circle cx="118" cy="68" r="3.5" fill="#64B5F6"/>

  <!-- Sopracciglia: una su, una giu -->
  <rect x="78" y="56" width="16" height="3" rx="1.5" fill="#42A5F5" opacity="0.7"/>
  <rect x="106" y="62" width="16" height="3" rx="1.5" fill="#42A5F5" opacity="0.7"/>

  <!-- Bocca a "mmmh" -->
  <ellipse cx="100" cy="92" rx="7" ry="4" fill="#64B5F6" opacity="0.5"/>

  <!-- Mano al mento -->
  <rect x="154" y="52" width="18" height="8" rx="4" fill="url(#bd)"/>
  <circle cx="172" cy="56" r="5" fill="#4B0082"/>
  
  <!-- Braccio sinistro piegato verso il mento -->
  <rect x="28" y="52" width="18" height="8" rx="4" fill="url(#bd)"/>
  <rect x="28" y="60" width="8" height="30" rx="4" fill="url(#bd)"/>
  <rect x="36" y="86" width="18" height="8" rx="4" fill="url(#bd)"/>
  <circle cx="36" cy="90" r="5" fill="#4B0082"/>

  <!-- Orecchie -->
  <rect x="43" y="62" width="16" height="22" rx="5" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  <rect x="141" y="62" width="16" height="22" rx="5" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  <rect x="47" y="67" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>
  <rect x="145" y="67" width="8" height="12" rx="3" fill="#4B0082" opacity="0.5"/>

  <!-- Corpo inferiore -->
  <rect x="70" y="132" width="60" height="35" rx="8" fill="url(#bd)" stroke="#64B5F6" stroke-width="1.5"/>
  
  <!-- Pallini pensiero -->
  <circle cx="85" cy="149" r="4" fill="#64B5F6" opacity="0.4"/>
  <circle cx="100" cy="149" r="4" fill="#64B5F6" opacity="0.4"/>
  <circle cx="115" cy="149" r="4" fill="#FFD700" opacity="0.4"/>

  <!-- Gambe -->
  <rect x="77" y="169" width="16" height="14" rx="4" fill="url(#bd)"/>
  <rect x="107" y="169" width="16" height="14" rx="4" fill="url(#bd)"/>
</svg>

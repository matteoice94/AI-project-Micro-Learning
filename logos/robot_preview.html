<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>MLPG Robot Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A1628; color: #fff; font-family: Arial; padding: 40px; text-align: center; }
    h1 { margin-bottom: 8px; }
    .sub { color: rgba(255,255,255,0.5); margin-bottom: 30px; }
    .showcase { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-bottom: 40px; }
    .card { background: linear-gradient(145deg, #141E30, #1A2332); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; }
    .card img { width: 180px; height: 180px; }
    .card p { margin-top: 8px; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
    .highlight { max-width: 260px; margin: 0 auto 40px; }
    .highlight img { width: 220px; height: 220px; }
    .label { display: inline-block; margin: 8px; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; background: rgba(0,63,135,0.4); color: #64B5F6; }
  </style>
</head>
<body>
  <h1>MLPG Robot Logo</h1>
  <p class="sub">Robot a faccia quadrata con espressioni animate — stile EdTech + AI</p>

  <div class="highlight">
    <img src="robot_face_animated.svg" alt="Robot animato">
    <p>Versione animata — ammicca, sorride, antenna pulsa</p>
    <span class="label">ANIMATO</span>
  </div>

  <div class="showcase">
    <div class="card">
      <img src="robot_face_neutral.svg" alt="Neutro">
      <p>Neutro / Felice</p>
      <span class="label">DEFAULT</span>
    </div>
    <div class="card">
      <img src="robot_face_thinking.svg" alt="Thinking">
      <p>Thinking / Dubbi</p>
      <span class="label">PENSIERO</span>
    </div>
    <div class="card">
      <img src="robot_face_surprised.svg" alt="Surprised">
      <p>Sorpreso / Idea!</p>
      <span class="label">IDEA</span>
    </div>
  </div>
</body>
</html>

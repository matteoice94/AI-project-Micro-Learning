<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MLPG Tutor Web</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --primary: #1f7ae0;
            --primary-dark: #155abf;
            --text: #202124;
            --muted: #5f6773;
            --border: #d7dbdf;
            --success: #0b792c;
            --warning: #d97706;
            --danger: #b00020;
        }
        * { box-sizing: border-box; }
        body { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
        .layout { display: flex; max-width: 1400px; margin: 20px auto; padding: 16px; gap: 20px; align-items: flex-start; }
        .sidebar { width: 280px; flex-shrink: 0; position: sticky; top: 20px; }
        .sidebar-section { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(15,23,42,.08); margin-bottom: 16px; padding: 18px; }
        .sidebar-section h3 { font-size: .95rem; margin: 0 0 10px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
        .sidebar-item { padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: .9rem; transition: background .15s; margin-bottom: 4px; }
        .sidebar-item:hover { background: #eef4ff; }
        .sidebar-item .tag { font-size: .75rem; background: #eef4ff; color: var(--primary); border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
        .sidebar-item .tag-archived { background: #fef3c7; color: #92400e; }
        .main { flex: 1; min-width: 0; }
        .card { background: var(--surface); border-radius: 18px; box-shadow: 0 18px 50px rgba(15,23,42,.08); margin-bottom: 20px; padding: 24px; }
        h1, h2, h3, h4 { margin: 0 0 12px 0; }
        p { line-height: 1.7; margin: 0 0 14px 0; }
        input, select, textarea, button { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 1rem; background: #fff; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31,122,224,.12); }
        textarea { resize: vertical; }
        button { cursor: pointer; background: var(--primary); color: #fff; transition: background .2s ease, transform .15s ease; }
        button:hover { background: var(--primary-dark); transform: translateY(-1px); }
        button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
        button.secondary:hover { background: #f0f6ff; }
        button.warning { background: #f59e0b; color: #202124; }
        button.warning:hover { background: #d97706; }
        .grid { display: grid; gap: 20px; }
        .cols-3 { grid-template-columns: 1.5fr 1fr; }
        .badge { display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px; border-radius: 999px; background: #eef4ff; color: #1b4f9c; font-size: .85rem; margin-top: 8px; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-error { background: #fce4ec; color: #b00020; }
        .error { color: var(--danger); font-weight: 600; margin-bottom: 10px; }
        .success { color: var(--success); }
        .hidden { display: none !important; }
        .tab-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
        .tab { padding: 10px 16px; border-radius: 999px; border: 1px solid var(--border); background: #fff; color: var(--muted); cursor: pointer; transition: all .18s ease; font-size: .9rem; }
        .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .tab.archived { border-color: var(--warning); color: var(--warning); }
        .tab.completed { border-color: var(--success); color: var(--success); }
        .progress-bar { height: 12px; border-radius: 999px; background: #dfe6ef; overflow: hidden; margin-top: 14px; }
        .progress-fill { height: 100%; width: 0%; background: var(--primary); transition: width .3s ease; }
        .module-card { border: 1px solid #e2e8f0; border-radius: 18px; padding: 20px; background: #fbfcff; }
        .summary-block { display: grid; gap: 12px; }
        .summary-item { background: #f8fafc; border-radius: 14px; padding: 16px; }
        .hint-box { background: #fff8e1; border: 1px solid #ffecb3; border-radius: 14px; padding: 16px; margin-top: 12px; }
        .archive-box { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 14px; padding: 16px; margin-top: 12px; }
        .esito-label { font-weight: 600; padding: 4px 12px; border-radius: 999px; display: inline-block; margin-bottom: 8px; }
        .small-text { color: var(--muted); font-size: .95rem; }
        .history-entry { border-bottom: 1px solid var(--border); padding: 12px 0; }
        .history-entry:last-child { border-bottom: none; }
        .history-toggle { cursor: pointer; padding: 8px; border-radius: 10px; transition: background .15s; }
        .history-toggle:hover { background: #f0f4f8; }
        .lang-selector { display: flex; gap: 8px; margin-bottom: 16px; }
        .lang-selector button { padding: 6px 14px; font-size: .85rem; border-radius: 8px; width: auto; }
        .lang-selector button.active-lang { background: var(--primary); color: #fff; }
    </style>
</head>
<body>
    <div style="text-align:right; padding:8px 20px; background:#fff; border-bottom:1px solid var(--border);">
        <span style="margin-right:10px;font-size:.9rem;color:var(--muted);" id="langLabel">Lingua / Language:</span>
        <button onclick="switchLang('it')" id="btnLangIT" style="width:auto;padding:4px 14px;margin:0 4px;font-size:.85rem;">🇮🇹 IT</button>
        <button onclick="switchLang('en')" id="btnLangEN" style="width:auto;padding:4px 14px;margin:0 4px;font-size:.85rem;">🇬🇧 EN</button>
    </div>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-section">
                <h3 id="sidebarArchivedTitle">Moduli da riprendere</h3>
                <div id="archivedList">
                    <p class="small-text" id="noArchivedMsg">Nessun modulo archiviato.</p>
                </div>
            </div>
            <div class="sidebar-section">
                <h3 id="sidebarHistoryTitle">Storico sessioni</h3>
                <div id="historyList">
                    <p class="small-text" id="loadingMsg">Caricamento...</p>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="card">
                <h1 id="mainHeading">MLPG Tutor Web</h1>
                <p id="mainDescription">Genera il percorso, rispondi agli esercizi e ricevi feedback, suggerimenti e chiarimenti mirati.</p>
            </div>

            <div class="card">
                <div id="message" class="error"></div>
                <label id="lblTopic">Argomento</label>
                <input id="topic" placeholder="Esempio: programmazione Python" />
                <label id="lblLevel">Livello</label>
                <select id="level">
                    <option value="" id="optSelect">Seleziona...</option>
                    <option value="base" id="optBase">Base</option>
                    <option value="intermedio" id="optIntermedio">Intermedio</option>
                    <option value="avanzato" id="optAvanzato">Avanzato</option>
                </select>
                <label id="lblName">Nome (opzionale)</label>
                <input id="name" placeholder="Es. Matteo" />
                <button style="margin-top: 12px;" onclick="generatePath()" id="btnGenerate">Genera percorso</button>
            </div>

            <div id="pathContainer"></div>

            <div id="summaryCard" class="card hidden">
                <h2 id="summaryTitle">Riepilogo sessione</h2>
                <div id="summaryContent"></div>
                <button id="generateSummaryButton" style="margin-top: 16px;" onclick="generateFinalSummary()">Genera riepilogo finale</button>
                <div id="salutoText" style="margin-top: 18px; font-size: 1rem; line-height: 1.7;"></div>
            </div>
        </main>
    </div>

    <script>
let currentLang = 'it';
        let currentResponse = null;
        let currentModuleIndex = 0;
        let currentSessionId = null;
        let puntiForza = [];
        let diarioNote = [];
        let interruzioneDubbio = false;
        let moduleSolutions = {};
        let finalSummary = null;
        let archiveModules = [];
        let currentArchiveView = null;

        let moduliDbIds = {};
        let moduliState = {};

        let _T = {};

        function t(key) {
            return _T[key] || key;
        }

        async function loadTranslations(lang) {
            try {
                const res = await fetch(`/api/translations?lang=${lang}`);
                const data = await res.json();
                if (data.success) {
                    _T = data.translations;
                    currentLang = lang;
                }
            } catch (e) { /* keep current translations */ }
        }

        async function switchLang(lang) {
            await loadTranslations(lang);
            document.getElementById('btnLangIT').className = lang === 'it' ? 'active-lang' : '';
            document.getElementById('btnLangEN').className = lang === 'en' ? 'active-lang' : '';
            document.documentElement.lang = lang;
            updateAllLabels();
            if (currentResponse) { renderPath(); }
            loadHistory();
            renderArchivedSidebar();
            updateSummary();
        }

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById('btnLangIT').className = lang === 'it' ? 'active-lang' : '';
            document.getElementById('btnLangEN').className = lang === 'en' ? 'active-lang' : '';
            document.documentElement.lang = lang;
            updateAllLabels();
            if (currentResponse) { renderPath(); }
            loadHistory();
            renderArchivedSidebar();
            updateSummary();
        }

        function updateAllLabels() {
            document.getElementById('lblTopic').textContent = t('html_topic_label');
            document.getElementById('lblLevel').textContent = t('html_level_label');
            document.getElementById('lblName').textContent = t('html_name_label');
            document.getElementById('topic').placeholder = t('html_topic_placeholder');
            document.getElementById('name').placeholder = t('html_name_placeholder');
            document.getElementById('btnGenerate').textContent = t('html_generate_btn');
            document.getElementById('mainHeading').textContent = t('html_main_heading');
            document.getElementById('mainDescription').textContent = t('html_main_description');
            document.getElementById('sidebarArchivedTitle').textContent = t('html_archived_sidebar');
            document.getElementById('sidebarHistoryTitle').textContent = t('html_history_sidebar');
            document.getElementById('optSelect').textContent = t('html_level_select');
            document.getElementById('optBase').textContent = t('html_base');
            document.getElementById('optIntermedio').textContent = t('html_intermediate');
            document.getElementById('optAvanzato').textContent = t('html_advanced');
            document.getElementById('summaryTitle').textContent = t('html_summary_title');
            document.getElementById('generateSummaryButton').textContent = t('html_summary_generate_btn');
            document.getElementById('langLabel').textContent = t('lang_label');
        }

        function setMessage(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadTranslations('it');
            updateAllLabels();
            loadHistory();
        });

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                if (!data.success) return;
                renderHistory(data.data);
            } catch (e) {}
        }

        function renderHistory(sessions) {
            const el = document.getElementById('historyList');
            if (!sessions.length) {
                el.innerHTML = `<p class="small-text">${t('html_no_sessions')}</p>`;
                return;
            }
            el.innerHTML = sessions.map(s => `
                <div class="history-entry">
                    <div class="history-toggle" onclick="toggleHistoryDetail(${s.id}, this)">
                        <strong>${s.topic}</strong> · ${s.level}
                        <span class="small-text">(${new Date(s.created_at).toLocaleDateString('it-IT')})</span>
                    </div>
                    <div id="historyDetail-${s.id}" class="hidden" style="padding: 8px 0 0 0;"></div>
                </div>
            `).join('');
        }

        async function toggleHistoryDetail(sessionId, toggleEl) {
            const detail = document.getElementById(`historyDetail-${sessionId}`);
            if (!detail.classList.contains('hidden')) {
                detail.classList.add('hidden');
                detail.innerHTML = '';
                return;
            }
            if (detail.dataset.loaded) {
                detail.classList.remove('hidden');
                return;
            }
            try {
                const res = await fetch('/api/session-detail', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ session_id: sessionId }),
                });
                const data = await res.json();
                if (!data.success) return;
                detail.dataset.loaded = '1';
                const modules = data.data;
                detail.innerHTML = modules.map(m => {
                    const statusTag = m.archived
                        ? `<span class="tag tag-archived">${t('html_archived_badge')}</span>`
                        : m.completed
                            ? `<span class="tag" style="background:#dcfce7;color:#166534;">${t('html_completed_badge')}</span>`
                            : '';
                    const attempts = (m.attempts || []).map(a =>
                        `<div class="small-text">→ ${a.esito || 'sbagliata'}: ${a.soluzione.substring(0, 60)}</div>`
                    ).join('');
                    return `
                        <div style="padding: 8px 0; border-bottom:1px solid #eee;">
                            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                                <span>${t('html_modules_list').split(' ')[0] || 'Module'} ${m.module_index + 1}</span> ${statusTag}
                            </div>
                            ${attempts ? `<div style="margin-top:4px;">${attempts}</div>` : ''}
                        </div>
                    `;
                }).join('');
                detail.classList.remove('hidden');
            } catch (e) {}
        }

        async function generatePath() {
            setMessage('');
            const topic = document.getElementById('topic').value.trim();
            const level = document.getElementById('level').value;
            const name = document.getElementById('name').value.trim();

            if (!topic || !level) {
                setMessage(t('html_topic_level_error'));
                return;
            }

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ topic, level, name, lang: currentLang }),
                });
                const data = await res.json();

                if (!data.success) {
                    setMessage(data.error || t('html_generation_error'));
                    return;
                }

                currentResponse = data.data;
                currentSessionId = data.session_id;
                currentModuleIndex = 0;
                currentArchiveView = null;
                puntiForza = [];
                diarioNote = [];
                interruzioneDubbio = false;
                moduleSolutions = {};
                finalSummary = null;
                archiveModules = [];
                moduliDbIds = data.module_db_ids || {};
                moduliState = {};

                const moduli = currentResponse.percorso_studio.moduli;
                moduli.forEach((m, i) => {
                    moduliState[m.id] = { tentativi: 0, ultimaRisposta: null, archived: false, completed: false };
                });

                renderPath();
                renderArchivedSidebar();
                loadHistory();
            } catch (err) {
                setMessage(t('html_connection_error'));
            }
        }

        function renderPath() {
            const container = document.getElementById('pathContainer');
            container.innerHTML = '';
            const { percorso_studio } = currentResponse;

            const header = document.createElement('div');
            header.className = 'card';
            header.innerHTML = `
                <h2>${t('html_learning_objective')}</h2>
                <p>${percorso_studio.metadati.objective_apprendimento}</p>
                <div class="badge">${t('html_level_badge')}: ${percorso_studio.metadati.difficolta_impostata}</div>
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            `;
            container.appendChild(header);

            const tabs = document.createElement('div');
            tabs.className = 'tab-list';
            percorso_studio.moduli.forEach((modulo, index) => {
                const tab = document.createElement('div');
                const state = moduliState[modulo.id];
                let extra = '';
                if (state.archived) extra = 'archived';
                else if (state.completed) extra = 'completed';
                tab.className = `tab ${index === currentModuleIndex && currentArchiveView === null ? 'active' : ''} ${extra}`;
                tab.textContent = `${t('html_modules_list').split(' ')[0] || 'Module'} ${modulo.id}`;
                if (state.archived) tab.textContent += ' 📦';
                else if (state.completed) tab.textContent += ' ✅';
                tab.onclick = () => { currentArchiveView = null; changeModule(index); };
                tabs.appendChild(tab);
            });
            container.appendChild(tabs);

            const moduleWrapper = document.createElement('div');
            moduleWrapper.id = 'moduleDetail';
            container.appendChild(moduleWrapper);
            renderModule();
            document.getElementById('summaryCard').classList.remove('hidden');
            updateSummary();
        }

        function renderModule() {
            const moduleWrapper = document.getElementById('moduleDetail');
            moduleWrapper.innerHTML = '';

            if (currentArchiveView !== null) {
                renderArchivedModuleView(moduleWrapper);
                return;
            }

            const module = currentResponse.percorso_studio.moduli[currentModuleIndex];
            const state = moduliState[module.id];

            if (state.archived) {
                moduleWrapper.innerHTML = `
                    <div class="card archive-box">
                        <h3>${t('html_modules_list').split(' ')[0] || 'Module'} ${module.id}: ${module.titolo_modulo}</h3>
                        <p>📦 ${t('html_archived_msg')}</p>
                    </div>
                `;
                return;
            }

            const card = document.createElement('div');
            card.className = 'card module-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                    <div>
                        <h3>${t('html_modules_list').split(' ')[0] || 'Module'} ${module.id}: ${module.titolo_modulo}</h3>
                        ${state.completed
                            ? `<div class="badge badge-success">✅ ${t('html_completed_badge')}</div>`
                            : `<div class="badge">${t('html_in_progress_badge')}</div>`}
                    </div>
                    <div style="text-align:right;">
                        <div class="small-text">${t('html_modules_list')}: ${currentResponse.percorso_studio.moduli.length}</div>
                        <div class="small-text">${t('html_current_module')}: ${currentModuleIndex + 1}</div>
                    </div>
                </div>
                <p><strong>${t('html_explanation_label')}</strong></p>
                <p>${module.spiegazione}</p>
                <p><strong>${t('html_exercise_label')}</strong></p>
                <p>${module.esercizio_pratico}</p>
                <div id="feedback-${module.id}"></div>
                <div id="hintArea-${module.id}"></div>
                ${!state.completed ? `
                    <label>${t('html_solution_label')}</label>
                    <textarea id="solution-${module.id}" rows="5" placeholder="${t('html_solution_placeholder')}"></textarea>
                    <button onclick="evaluateModule(${module.id})" style="margin-top:12px;">${t('html_eval_btn')}</button>
                    <button onclick="showClarify(${module.id})" class="warning" style="margin-top:12px;">${t('html_clarify_btn')}</button>
                    <div id="clarify-${module.id}" class="hidden clarification"></div>
                ` : ''}
                <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:18px;">
                    <button onclick="prevModule()" class="secondary" style="flex:1;">${t('html_prev_module')}</button>
                    <button onclick="nextModule()" style="flex:1;">${t('html_next_module')}</button>
                </div>
            `;
            moduleWrapper.appendChild(card);

            updateProgress();
            updateTabs();
            updateArchivedSidebar();
        }

        function renderArchivedModuleView(wrapper) {
            const { modulo } = currentArchiveView;
            const card = document.createElement('div');
            card.className = 'card module-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
                    <div>
                        <h3>📦 ${t('html_modules_list').split(' ')[0] || 'Module'} ${modulo.id}: ${modulo.titolo_modulo}</h3>
                        <div class="badge badge-warning">${t('html_retake_badge')}</div>
                    </div>
                </div>
                <p><strong>${t('html_explanation_label')}</strong></p>
                <p>${modulo.spiegazione}</p>
                <p><strong>${t('html_exercise_label')}</strong></p>
                <p>${modulo.esercizio_pratico}</p>
                <div id="archiveFeedback-${modulo.id}"></div>
                <div id="archiveHintArea-${modulo.id}"></div>
                <label>${t('html_solution_label')}</label>
                <textarea id="archiveSolution-${modulo.id}" rows="5" placeholder="${t('html_retry_placeholder')}"></textarea>
                <button onclick="evaluateArchivedModule(${modulo.id})" style="margin-top:12px;">${t('html_eval_btn')}</button>
                <button onclick="closeArchiveView()" class="secondary" style="margin-top:12px;">${t('html_close_archive')}</button>
                <div id="archiveClarify-${modulo.id}" class="clarification hidden"></div>
            `;
            wrapper.appendChild(card);
            updateProgress();
            updateTabs();
        }

        function closeArchiveView() {
            currentArchiveView = null;
            renderModule();
        }

        function changeModule(index) {
            currentModuleIndex = index;
            renderModule();
        }

        function prevModule() {
            if (currentModuleIndex > 0) {
                currentModuleIndex -= 1;
                renderModule();
            }
        }

        function nextModule() {
            if (currentModuleIndex < currentResponse.percorso_studio.moduli.length - 1) {
                currentModuleIndex += 1;
                renderModule();
            }
        }

        function updateTabs() {
            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === currentModuleIndex && currentArchiveView === null);
            });
        }

        function updateProgress() {
            const { percorso_studio } = currentResponse;
            let completed = 0;
            percorso_studio.moduli.forEach(m => { if (moduliState[m.id].completed) completed++; });
            const pct = (completed / percorso_studio.moduli.length) * 100;
            const fill = document.getElementById('progressFill');
            if (fill) fill.style.width = `${pct}%`;
        }

        async function evaluateModule(moduleId) {
            setMessage('');
            const solution = document.getElementById(`solution-${moduleId}`).value.trim();
            const modulo = currentResponse.percorso_studio.moduli.find(m => m.id === moduleId);
            const state = moduliState[moduleId];

            if (!solution) {
                setMessage(t('html_insert_solution'));
                return;
            }

            try {
                const res = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        esercizio: modulo.esercizio_pratico,
                        soluzione: solution,
                        module_db_id: moduliDbIds[moduleId],
                        lang: currentLang,
                    }),
                });
                const data = await res.json();
                const feedbackDiv = document.getElementById(`feedback-${moduleId}`);

                if (!data.success) {
                    feedbackDiv.innerHTML = `<p class="error">${data.error || t('html_eval_error')}</p>`;
                    return;
                }

                const esito = data.esito || 'sbagliata';

                if (esito === 'corretta') {
                    state.completed = true;
                    moduleSolutions[moduleId] = { esercizio: modulo.esercizio_pratico, soluzione };
                    if (moduliDbIds[moduleId]) {
                        await fetch('/api/complete-module', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ module_db_id: moduliDbIds[moduleId] }),
                        });
                    }
                    puntiForza.push(data.commento_costruttivo);
                    feedbackDiv.innerHTML = `
                        <div class="badge badge-success">✅ ${t('html_correct_status')}</div>
                        <p><strong>${t('html_comment_label')}:</strong> ${data.commento_costruttivo}</p>
                        <p><strong>${t('html_suggestion_label')}:</strong> ${data.suggerimento_miglioramento}</p>
                    `;
                    document.getElementById(`hintArea-${moduleId}`).innerHTML = '';
                    renderModule();
                    updateSummary();
                    return;
                }

                const sameAnswer = state.ultimaRisposta === solution;
                if (!sameAnswer) {
                    state.tentativi += 1;
                    state.ultimaRisposta = solution;
                }

                feedbackDiv.innerHTML = `
                    <div class="badge ${esito === 'parziale' ? 'badge-warning' : 'badge-error'}">
                        ${esito === 'parziale' ? '🤔 ' + t('html_partial_status') : '😅 ' + t('html_wrong_status')}
                    </div>
                    <p><strong>${t('html_comment_label')}:</strong> ${data.commento_costruttivo}</p>
                    <p><strong>${t('html_suggestion_label')}:</strong> ${data.suggerimento_miglioramento}</p>
                `;

                if (state.tentativi >= 2 && !sameAnswer) {
                    state.archived = true;
                    archiveModules.push({ id: modulo.id, titolo: modulo.titolo_modulo, spiegazione: modulo.spiegazione, esercizio: modulo.esercizio_pratico, livello: document.getElementById('level').value });
                    if (moduliDbIds[moduleId]) {
                        await fetch('/api/archive-module', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ module_db_id: moduliDbIds[moduleId] }),
                        });
                    }
                    diarioNote.push(`Module ${modulo.id} (${modulo.titolo_modulo}): archived after 2 attempts`);
                    document.getElementById(`hintArea-${moduleId}`).innerHTML = `
                        <div class="archive-box">
                            <p>📦 ${t('html_archived_after')}</p>
                        </div>
                    `;
                    renderModule();
                    renderArchivedSidebar();
                    updateSummary();
                    return;
                }

                if (!sameAnswer) {
                    try {
                        const hintRes = await fetch('/api/hint', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                esercizio: modulo.esercizio_pratico,
                                soluzione: solution,
                                livello: document.getElementById('level').value,
                                tentativo: state.tentativi,
                                lang: currentLang,
                            }),
                        });
                        const hintData = await hintRes.json();
                        const hintText = hintData.success ? hintData.hint : t('html_same_answer');
                        const hintHeader = t('html_hint_prefix').replace('{count}', state.tentativi);
                        document.getElementById(`hintArea-${moduleId}`).innerHTML = `
                            <div class="hint-box">
                                <strong>💡 ${hintHeader}:</strong>
                                <p style="margin-top:6px;">${hintText}</p>
                            </div>
                        `;
                    } catch (e) {
                        document.getElementById(`hintArea-${moduleId}`).innerHTML = `
                            <div class="hint-box">
                                <strong>💡 ${t('html_hint_simple')}:</strong>
                                <p style="margin-top:6px;">${t('html_same_answer')}</p>
                            </div>
                        `;
                    }
                } else {
                    document.getElementById(`hintArea-${moduleId}`).innerHTML = `
                        <div class="hint-box">
                            <p>ℹ️ ${t('html_same_answer')}</p>
                        </div>
                    `;
                }
                updateSummary();
            } catch (err) {
                setMessage(t('html_connection_eval_error'));
            }
        }

        async function evaluateArchivedModule(moduleId) {
            setMessage('');
            const solution = document.getElementById(`archiveSolution-${moduleId}`).value.trim();
            const modulo = currentArchiveView.modulo;

            if (!solution) {
                setMessage(t('html_insert_solution'));
                return;
            }

            try {
                const res = await fetch('/api/evaluate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        esercizio: modulo.esercizio_pratico,
                        soluzione: solution,
                        module_db_id: null,
                        lang: currentLang,
                    }),
                });
                const data = await res.json();
                const feedbackDiv = document.getElementById(`archiveFeedback-${moduleId}`);

                if (!data.success) {
                    feedbackDiv.innerHTML = `<p class="error">${data.error || t('html_error_label')}</p>`;
                    return;
                }

                const esito = data.esito || 'sbagliata';
                let badgeClass = 'badge-success';
                let icon = '✅';
                if (esito === 'parziale') { badgeClass = 'badge-warning'; icon = '🤔'; }
                else if (esito === 'sbagliata') { badgeClass = 'badge-error'; icon = '😅'; }

                const esitoLabel = esito === 'corretta' ? t('html_correct_status') : esito === 'parziale' ? t('html_partial_status') : t('html_wrong_status');
                feedbackDiv.innerHTML = `
                    <div class="badge ${badgeClass}">${icon} ${esitoLabel}</div>
                    <p><strong>${t('html_comment_label')}:</strong> ${data.commento_costruttivo}</p>
                    <p><strong>${t('html_suggestion_label')}:</strong> ${data.suggerimento_miglioramento}</p>
                `;

                if (esito !== 'corretta') {
                    try {
                        const hintRes = await fetch('/api/hint', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                esercizio: modulo.esercizio_pratico,
                                soluzione: solution,
                                livello: currentArchiveView.livello || document.getElementById('level').value,
                                tentativo: 1,
                                lang: currentLang,
                            }),
                        });
                        const hintData = await hintRes.json();
                        const hintText = hintData.success ? hintData.hint : t('html_same_answer');
                        document.getElementById(`archiveHintArea-${moduleId}`).innerHTML = `
                            <div class="hint-box">
                                <strong>💡 ${t('html_hint_simple')}:</strong>
                                <p style="margin-top:6px;">${hintText}</p>
                            </div>
                        `;
                    } catch (e) {
                        document.getElementById(`archiveHintArea-${moduleId}`).innerHTML = `
                            <div class="hint-box">
                                <strong>💡 ${t('html_hint_simple')}:</strong>
                                <p style="margin-top:6px;">${t('html_same_answer')}</p>
                            </div>
                        `;
                    }
                }
            } catch (err) {
                setMessage(t('html_connection_error'));
            }
        }

        function renderArchivedSidebar() {
            const el = document.getElementById('archivedList');
            if (!archiveModules.length) {
                el.innerHTML = `<p class="small-text">${t('html_no_archived')}</p>`;
                return;
            }
            el.innerHTML = archiveModules.map((m, i) => `
                <div class="sidebar-item" onclick="openArchivedModule(${i})">
                    📦 ${m.titolo}
                    <span class="tag tag-archived">${t('html_archived_badge')}</span>
                </div>
            `).join('');
        }

        function updateArchivedSidebar() {
            renderArchivedSidebar();
        }

        function openArchivedModule(index) {
            const m = archiveModules[index];
            currentArchiveView = {
                modulo: {
                    id: m.id,
                    titolo_modulo: m.titolo,
                    spiegazione: m.spiegazione,
                    esercizio_pratico: m.esercizio,
                },
                livello: m.livello,
            };
            document.getElementById('moduleDetail').innerHTML = '';
            renderModule();
        }

        function showClarify(moduleId) {
            const clarifyDiv = document.getElementById(`clarify-${moduleId}`);
            if (!clarifyDiv.classList.contains('hidden')) {
                clarifyDiv.classList.add('hidden');
                clarifyDiv.innerHTML = '';
                return;
            }
            clarifyDiv.classList.remove('hidden');
            clarifyDiv.innerHTML = `
                <label>${t('html_doubt_label')}</label>
                <textarea id="dubbio-${moduleId}" rows="3" placeholder="${t('html_doubt_placeholder')}"></textarea>
                <button onclick="clarifyModule(${moduleId})" class="warning" style="margin-top:10px;">${t('html_clarify_targeted')}</button>
            `;
        }

        async function clarifyModule(moduleId) {
            setMessage('');
            const dubbio = document.getElementById(`dubbio-${moduleId}`).value.trim();
            const modulo = currentResponse.percorso_studio.moduli.find(m => m.id === moduleId);
            const level = document.getElementById('level').value;

            if (!dubbio) {
                setMessage(t('html_insert_doubt'));
                return;
            }

            try {
                const res = await fetch('/api/clarify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ argomento: modulo.titolo_modulo, spiegazione: modulo.spiegazione, dubbio, livello: level, lang: currentLang }),
                });
                const data = await res.json();
                const clarifyDiv = document.getElementById(`clarify-${moduleId}`);

                if (!data.success) {
                    clarifyDiv.innerHTML += `<p class="error">${data.error || t('html_error_label')}</p>`;
                    return;
                }

                interruzioneDubbio = true;
                diarioNote.push(`Module ${moduleId} - ${modulo.titolo_modulo}: ${dubbio}`);
                clarifyDiv.innerHTML = `
                    <div class="badge">${t('html_clarify_targeted_label')}</div>
                    <p><strong>${t('html_explanation_text')}:</strong> ${data.data.spiegazione_semplificata}</p>
                    <p><strong>${t('html_practical_example')}:</strong> ${data.data.esempio_pratico}</p>
                    <p><strong>${t('html_suggested_steps')}:</strong></p>
                    <ul>${data.data.passaggi.map(p => `<li>${p}</li>`).join('')}</ul>
                `;
                updateSummary();
            } catch (err) {
                setMessage(t('html_connection_error'));
            }
        }

        function updateSummary() {
            const summary = document.getElementById('summaryContent');
            const summaryButton = document.getElementById('generateSummaryButton');

            if (summaryButton) {
                summaryButton.style.display = currentResponse ? 'block' : 'none';
                summaryButton.textContent = t('html_summary_generate_btn');
            }

            if (finalSummary) {
                summary.innerHTML = `
                    <div class="summary-item">
                        <h3>${t('html_summary_strengths')}</h3>
                        <ul>${finalSummary.punti_di_forza.length ? finalSummary.punti_di_forza.map(p => `<li>${p}</li>`).join('') : `<li>${t('html_no_strengths')}</li>`}</ul>
                    </div>
                    <div class="summary-item">
                        <h3>${t('html_summary_improvements')}</h3>
                        <ul>${finalSummary.punti_da_migliorare.length ? finalSummary.punti_da_migliorare.map(p => `<li>${p}</li>`).join('') : `<li>${t('html_no_improvements')}</li>`}</ul>
                    </div>
                    <div class="summary-item">
                        <h3>${t('html_summary_logbook')}</h3>
                        <p>${finalSummary.diario_di_bordo || t('html_no_notes')}</p>
                    </div>
                    <div class="summary-item">
                        <h3>${t('html_summary_farewell')}</h3>
                        <p>${finalSummary.saluto_conclusivo || t('html_no_greeting')}</p>
                    </div>
                `;
                document.getElementById('salutoText').textContent = '';
                document.getElementById('summaryTitle').textContent = t('html_summary_title');
                return;
            }

            if (!currentResponse) return;

            document.getElementById('summaryTitle').textContent = t('html_summary_title');

            const level = document.getElementById('level').value || 'N/D';
            const { percorso_studio } = currentResponse;
            const completati = percorso_studio.moduli.filter(m => moduliState[m.id].completed).length;
            const archiviati = percorso_studio.moduli.filter(m => moduliState[m.id].archived).length;
            const moduliNote = diarioNote.length ? diarioNote.join('; ') : t('html_no_difficulties');

            summary.innerHTML = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="summary-item">
                        <strong>${t('html_level_status')}</strong>
                        <p>${level}</p>
                    </div>
                    <div class="summary-item">
                        <strong>${t('html_progress')}</strong>
                        <p>${completati}/${percorso_studio.moduli.length} ${t('html_completed_count')}</p>
                    </div>
                    <div class="summary-item">
                        <strong>${t('html_archived_count')}</strong>
                        <p>${archiviati}</p>
                    </div>
                    <div class="summary-item">
                        <strong>${t('html_collected_comments')}</strong>
                        <p>${Object.keys(moduleSolutions).length}</p>
                    </div>
                </div>
                <div class="summary-item" style="margin-top:12px;">
                    <strong>${t('html_diary_label')}</strong>
                    <p>${moduliNote}</p>
                </div>
            `;
            document.getElementById('salutoText').textContent = '';
        }

        async function generateFinalSummary() {
            setMessage('');
            const level = document.getElementById('level').value;
            const solutions = Object.values(moduleSolutions);

            if (solutions.length === 0) {
                setMessage(t('html_insert_at_least_one'));
                return;
            }

            try {
                const res = await fetch('/api/final-summary', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ solutions, diary: diarioNote, livello: level, session_id: currentSessionId, lang: currentLang }),
                });
                const data = await res.json();

                if (!data.success) {
                    setMessage(data.error || t('html_eval_error'));
                    return;
                }

                finalSummary = data.data;
                document.getElementById('salutoText').textContent = '';
                updateSummary();
            } catch (err) {
                setMessage(t('html_connection_error'));
            }
        }

        // Init button styles
        document.getElementById('btnLangIT').className = 'active-lang';
    </script>
</body>
</html>
